events {}

http {

    # Redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name api.yourrestaurant.com admin.yourrestaurant.com;
        return 301 https://$host$request_uri;
    }

    # API
    server {
        listen 443 ssl;
        server_name api.yourrestaurant.com;

        ssl_certificate     /etc/letsencrypt/live/api.yourrestaurant.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yourrestaurant.com/privkey.pem;

        location / {
            proxy_pass         http://api:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # Admin panel (React static files)
    server {
        listen 443 ssl;
        server_name admin.yourrestaurant.com;

        ssl_certificate     /etc/letsencrypt/live/admin.yourrestaurant.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.yourrestaurant.com/privkey.pem;

        root /usr/share/nginx/admin;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}